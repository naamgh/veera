<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>veera.cc</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<button id="focusToggleBtn" class="focus-toggle" type="button" title="Hide setup panel"><span class="setup-arrow">‹</span><span class="setup-label">SETUP</span></button>
<button id="exitRideModeBtn" class="floating-exit ghost">Exit Ride Mode</button>
<div id="savedWorkoutsOverlay" class="settings-overlay"></div>
<div id="savedWorkoutsModal" class="saved-workouts-modal"></div>
<div id="workoutEndOverlay" class="settings-overlay"></div>
<div id="workoutEndModal" class="workout-end-modal"></div>
<div id="stopConfirmOverlay" class="settings-overlay"></div>
<div id="stopConfirmModal" class="stop-confirm-modal"></div>
<div style="display:none" aria-hidden="true">
  <span id="targetPower"></span><span id="intervalText"></span><span id="currentName"></span><span id="remainingText"></span><span id="nextName"></span><span id="feedbackTitle"></span><span id="feedbackText"></span>
</div>
<div style="display:none" aria-hidden="true">
  <span id="rideBlockTitle"></span><span id="rideTargetPower"></span><span id="rideSubText"></span>
</div>
<main class="app"></main>
<script src="./app-shell.js"></script>
<script src="./app-modal-shell.js"></script>
<script src="./keyboard-guard.js"></script>
<script src="./main.js"></script>
<script src="./keyboard-shortcuts-fix.js"></script>
<script src="./share-card-strong.js"></script>
<script src="./workout-reset.js"></script>
</body>
</html>

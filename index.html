<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Veera</title>
<style>
:root{
  --bg:#ffffff;
  --panel:#ffffff;
  --ink:#101827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --soft:#f8fafc;
  --primary:#7dd3fc;
  --accent:#a78bfa;
  --shadow:0 18px 45px rgba(15,23,42,.08);
  --radius:28px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 0%, rgba(125,211,252,.18), transparent 30%),
    radial-gradient(circle at 90% 8%, rgba(167,139,250,.18), transparent 32%),
    linear-gradient(180deg,#ffffff,#f8fafc 60%,#ffffff);
  min-height:100vh;
}
.hero-wrap{
  padding:28px;
}
.hero{
  max-width:1320px;
  margin:0 auto;
  border-radius:34px;
  padding:42px;
  background:linear-gradient(135deg,#111827,#182235 60%,#0f172a);
  color:#fff;
  position:relative;
  overflow:hidden;
  box-shadow:var(--shadow);
}
.hero:after{
  content:"";
  position:absolute;
  width:360px;
  height:360px;
  border-radius:50%;
  right:-120px;
  top:-120px;
  background:radial-gradient(circle,rgba(125,211,252,.55),transparent 65%);
}
.hero-content{
  position:relative;
  z-index:1;
}
.hero h1{
  margin:0;
  font-size:64px;
  letter-spacing:-.07em;
  line-height:.92;
}
.hero p{
  margin-top:18px;
  max-width:720px;
  font-size:18px;
  color:#cbd5e1;
  line-height:1.6;
}
.hero-actions{
  display:flex;
  gap:14px;
  margin-top:28px;
  flex-wrap:wrap;
}
.hero-actions a{
  text-decoration:none;
}
.btn{
  border:none;
  border-radius:18px;
  padding:16px 24px;
  font-weight:900;
  font-size:15px;
  letter-spacing:.02em;
  cursor:pointer;
  transition:transform .16s ease, box-shadow .16s ease;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:220px;
}
.btn:hover{
  transform:translateY(-2px);
}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;
  box-shadow:0 16px 34px rgba(125,211,252,.22);
}
.btn-secondary{
  background:rgba(255,255,255,.08);
  color:#fff;
  border:1px solid rgba(255,255,255,.14);
}
.content-grid{
  max-width:1320px;
  margin:22px auto 40px;
  padding:0 28px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.card{
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);
  border:1px solid rgba(229,231,235,.9);
  border-radius:28px;
  padding:24px;
  box-shadow:var(--shadow);
}
.card h2{
  margin:0 0 18px;
  font-size:22px;
  letter-spacing:-.04em;
}
.content-box{
  color:#374151;
  line-height:1.7;
  white-space:pre-wrap;
}
.content-box h1,
.content-box h2,
.content-box h3{
  margin-top:0;
}
.footer-note{
  margin-top:18px;
  font-size:13px;
  color:var(--muted);
}
@media(max-width:900px){
  .hero h1{
    font-size:46px;
  }
  .content-grid{
    grid-template-columns:1fr;
  }
  .btn{
    width:100%;
  }
}
</style>
</head>
<body>
<div class="hero-wrap">
  <section class="hero">
    <div class="hero-content">
      <h1>Veera</h1>
      <p>
        A modern indoor training ecosystem focused on structured workouts, clean visuals,
        and a refined athlete experience.
      </p>

      <div class="hero-actions">
        <a href="/app/"><button class="btn btn-primary">TRAINER</button></a>
        <a href="/workout-builder/"><button class="btn btn-secondary">WORKOUT BUILDER</button></a>
      </div>
    </div>
  </section>
</div>

<section class="content-grid">
  <div class="card">
    <h2>Updates</h2>
    <div id="updates" class="content-box">Loading updates...</div>
    <div class="footer-note">
      Edit content/updates.md in GitHub to post updates.
    </div>
  </div>

  <div class="card">
    <h2>To Do List</h2>
    <div id="todo" class="content-box">Loading tasks...</div>
    <div class="footer-note">
      Edit content/todo.md in GitHub to update roadmap items.
    </div>
  </div>
</section>

<script>
async function loadContent(path,id){
  try{
    const res = await fetch(path);
    const text = await res.text();
    document.getElementById(id).textContent = text;
  }catch(err){
    document.getElementById(id).textContent = 'Unable to load content.';
  }
}

loadContent('/content/updates.md','updates');
loadContent('/content/todo.md','todo');
</script>
</body>
</html>

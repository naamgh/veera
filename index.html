<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Veera</title>
<style>
:root{
  --bg:#ffffff;
  --panel:#ffffff;
  --ink:#101827;
  --muted:#6b7280;
  --line:#e5e7eb;
  --soft:#f8fafc;
  --primary:#7dd3fc;
  --accent:#a78bfa;
  --shadow:0 18px 45px rgba(15,23,42,.08);
  --radius:28px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f8fafc,#eef2ff 58%,#ffffff);min-height:100vh;position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-28%;z-index:-2;pointer-events:none;background:radial-gradient(circle at 18% 18%, rgba(14,165,233,.34), transparent 30%),radial-gradient(circle at 82% 12%, rgba(124,58,237,.30), transparent 28%),radial-gradient(circle at 72% 78%, rgba(6,182,212,.22), transparent 32%),radial-gradient(circle at 22% 84%, rgba(99,102,241,.24), transparent 30%),linear-gradient(135deg,#eef2ff,#f8fafc 44%,#ecfeff);filter:blur(36px) saturate(1.18);transform:scale(1.04);animation:meshBreath 18s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:rgba(255,255,255,.34);backdrop-filter:blur(2px)}
@keyframes meshBreath{0%{transform:scale(1.04) translate3d(-1.8%,-1.2%,0) rotate(-1deg)}45%{transform:scale(1.10) translate3d(1.4%,.8%,0) rotate(1.4deg)}100%{transform:scale(1.07) translate3d(-.6%,1.6%,0) rotate(-.6deg)}}
.launch-wrap{min-height:58vh;padding:56px 28px 28px;display:flex;align-items:center;justify-content:center}
.launch-grid{display:grid;grid-template-columns:repeat(2,minmax(220px,300px));gap:24px;width:100%;max-width:660px}
.launch-item{display:flex;flex-direction:column;align-items:center;gap:14px}
.launch-card{width:100%;aspect-ratio:1/1;border-radius:34px;text-decoration:none;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:28px;font-weight:950;letter-spacing:-.04em;background:linear-gradient(135deg,var(--primary),var(--accent));box-shadow:0 24px 55px rgba(125,211,252,.24);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;position:relative;overflow:hidden}
.launch-card:after{content:"";position:absolute;width:180px;height:180px;border-radius:999px;right:-70px;top:-70px;background:rgba(255,255,255,.22)}
.launch-card span{position:relative;z-index:1}
.launch-card:hover{transform:translateY(-6px);box-shadow:0 30px 70px rgba(167,139,250,.28);filter:saturate(1.06)}
.launch-card.secondary{background:linear-gradient(135deg,#bae6fd,#a78bfa)}
.requirements{width:100%;padding:0 8px;color:var(--muted);font-size:13px;line-height:1.6;text-align:left}
.requirements strong{display:block;margin-bottom:4px;color:#374151;font-size:12px;letter-spacing:.02em;text-transform:uppercase}
.content-grid{max-width:1320px;margin:0 auto 40px;padding:0 28px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border:1px solid rgba(229,231,235,.9);border-radius:28px;padding:24px;box-shadow:var(--shadow)}
.card h2{margin:0 0 18px;font-size:22px;letter-spacing:-.04em}
.content-box{color:#374151;line-height:1.7;white-space:pre-wrap}
.footer-note{margin-top:18px;font-size:13px;color:var(--muted)}
.roadmap-overall{margin-bottom:22px}
.roadmap-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:#475569}
.progress-bar{height:12px;border-radius:999px;background:#e2e8f0;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#38bdf8,#8b5cf6);width:0;transition:width .4s ease}
.roadmap-track{padding:16px 0;border-top:1px solid rgba(226,232,240,.8)}
.roadmap-track:first-of-type{border-top:none;padding-top:0}
.track-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:8px}
.track-title{font-size:16px;font-weight:700;color:#0f172a}
.track-percent{font-size:13px;color:#64748b;font-weight:700}
.track-desc{font-size:13px;color:#64748b;margin-bottom:10px;line-height:1.5}
.track-task-list{display:flex;flex-direction:column;gap:8px}
.track-task{display:flex;align-items:center;gap:10px;font-size:13px;color:#334155}
.track-dot{width:10px;height:10px;border-radius:999px;background:#cbd5e1;flex-shrink:0}
.track-task.done .track-dot{background:linear-gradient(135deg,#38bdf8,#8b5cf6)}
.track-task.done{opacity:.72}
@media(max-width:760px){.launch-wrap{min-height:50vh;padding-top:34px}.launch-grid{grid-template-columns:1fr;max-width:320px}.content-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<section class="launch-wrap">
  <div class="launch-grid">
    <div class="launch-item">
      <a class="launch-card" href="/app/"><span>TRAINER</span></a>
      <div class="requirements">
        <strong>System Requirements</strong>
• Chrome or Edge browser<br>
• FTMS-compatible Smart trainer<br>
• Non-faulty bluetooth heart rate monitor<br>
• Desktop or laptop
      </div>
    </div>
    <div class="launch-item">
      <a class="launch-card secondary" href="/workout-builder/"><span>WORKOUT<br>BUILDER</span></a>
    </div>
  </div>
</section>
<section class="content-grid">
  <div class="card">
    <h2>Updates</h2>
    <div id="updates" class="content-box">Loading updates...</div>
  </div>
  <div class="card">
    <h2>Roadmap</h2>
    <div id="roadmapRoot">Loading roadmap...</div>
  </div>
</section>
<script>
async function loadContent(path,id){
  try{
    const res=await fetch(path);
    const text=await res.text();
    document.getElementById(id).textContent=text;
  }catch(err){
    document.getElementById(id).textContent='Unable to load content.';
  }
}

async function loadRoadmap(){
  const root=document.getElementById('roadmapRoot');
  try{
    const res=await fetch('/content/roadmap.json');
    const data=await res.json();

    const tracks=data.tracks||[];
    const total=tracks.flatMap(t=>t.items||[]).length;
    const completed=tracks.flatMap(t=>t.items||[]).filter(i=>i.done).length;
    const overall=Math.round((completed/Math.max(total,1))*100);

    let html='';

    html+=`<div class="roadmap-overall">
      <div class="roadmap-meta">
        <strong>${data.title||'Roadmap'}</strong>
        <span>${overall}% Complete</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${overall}%"></div>
      </div>
    </div>`;

    tracks.forEach(track=>{
      const items=track.items||[];
      const done=items.filter(i=>i.done).length;
      const pct=Math.round((done/Math.max(items.length,1))*100);

      html+=`<div class="roadmap-track">
        <div class="track-head">
          <div>
            <div class="track-title">${track.title}</div>
            <div class="track-desc">${track.description||''}</div>
          </div>
          <div class="track-percent">${pct}%</div>
        </div>
        <div class="progress-bar" style="margin-bottom:12px">
          <div class="progress-fill" style="width:${pct}%"></div>
        </div>
        <div class="track-task-list">
          ${items.map(item=>`
            <div class="track-task ${item.done?'done':''}">
              <span class="track-dot"></span>
              <span>${item.task}</span>
            </div>
          `).join('')}
        </div>
      </div>`;
    });

    root.innerHTML=html;
  }catch(err){
    root.textContent='Unable to load roadmap.';
  }
}

loadContent('/content/updates.md','updates');
loadRoadmap();
</script>
</body>
</html>
